<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Filled from the manifest name by popup.js. -->
    <h1 id="title"></h1>

    <label class="row master">
      <input type="checkbox" id="enabled" />
      <span>Enabled</span>
    </label>

    <section>
      <h2>Subscriptions feed</h2>

      <label class="row">
        <input type="checkbox" id="hideShorts" />
        <span>Hide Shorts</span>
      </label>

      <label class="row">
        <input type="checkbox" id="hideShelves" />
        <span>Hide "Most relevant" and other shelves</span>
      </label>

      <label class="row">
        <input type="checkbox" id="watchLater" />
        <span>Watch Later button next to each thumbnail</span>
      </label>

      <label class="row slider">
        <span>Thumbnail width <output id="thumbWidthValue"></output></span>
        <input type="range" id="thumbWidth" min="160" max="400" step="10" />
      </label>
    </section>

    <section>
      <h2>Watch Later page</h2>

      <label class="row">
        <input type="checkbox" id="wlRemove" />
        <span>Remove button on each video</span>
      </label>
    </section>

    <section>
      <h2>Debugging</h2>

      <label class="row">
        <input type="checkbox" id="debug" />
        <span>Log details to the console</span>
      </label>
    </section>

    <p class="hint">Changes apply immediately on open YouTube tabs.</p>

    <script src="popup.js"></script>
  </body>
</html>
